name: test downstream

on:
  workflow_dispatch:
  schedule:
    # Weekly Monday 9AM build
    # * is a special character in YAML so you have to quote this string
    - cron: "0 9 * * 1"
  pull_request:
    # We also want this workflow triggered if the `Downstream CI` label is
    # added or present when PR is updated
    types:
      - synchronize
      - labeled
  push:
    tags:
      - "*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  environment:
    runs-on: ubuntu-latest
    outputs:
      data_path: ${{ steps.data_path.outputs.path }}
    steps:
      - id: data_path
        run: echo "path=${{ runner.temp }}/data" >> $GITHUB_OUTPUT

  crds_contexts:
    uses: spacetelescope/crds/.github/workflows/contexts.yml@main

  # retrieve_cache.yml only looks up the key of the most recent cache of the
  # STPSF/GalSim data romanisim needs, and since a reusable workflow's
  # `github.repository` resolves to the *caller's* repo (gwcs), it can only
  # ever see caches that already exist in gwcs's own cache store -- it never
  # sees the cache romanisim's own scheduled data.yml writes to romanisim's
  # repo. Call data.yml directly instead so the data is actually downloaded
  # and cached (write, not just read) under gwcs's own cache store.
  romanisim_data:
    uses: spacetelescope/romanisim/.github/workflows/data.yml@main
    with:
      cache_path: /tmp/data

  downstream:
    needs: [environment, crds_contexts, romanisim_data]
    # Only romanisim needs its data cache, so a missing one must not block the
    # other packages.
    if: ${{ !cancelled() && needs.environment.result == 'success' && needs.crds_contexts.result == 'success' }}
    uses: ./.github/workflows/nox_matrix.yml
    with:
      kind: downstream
      # Third-party packages are only tested on labeled pull requests.
      setup-args: ${{ github.repository == 'spacetelescope/gwcs' && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'Downstream CI')) && '--labeled' || '' }}
      # CRDS_SERVER_URL is package specific, so the noxfile sets it per session.
      setenv: |
        CRDS_PATH=${{ needs.environment.outputs.data_path }}/crds
        CRDS_CLIENT_RETRY_COUNT=3
        CRDS_CLIENT_RETRY_DELAY_SECONDS=20
        STPSF_PATH=${{ needs.romanisim_data.outputs.cache_path }}/stpsf-data/
        GALSIM_CAT_PATH=${{ needs.romanisim_data.outputs.cache_path }}/galsim_data/real_galaxy_catalog_23.5_example.fits
      cache-path: ${{ needs.environment.outputs.data_path }}/crds
      cache-key: crds-${{ needs.crds_contexts.outputs.jwst }}
      restore-cache-path: ${{ needs.romanisim_data.outputs.cache_path }}
      restore-cache-key: ${{ needs.romanisim_data.outputs.cache_key }}
