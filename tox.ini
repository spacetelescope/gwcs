[tox]
default_base_python = 3.12
envlist =
    check-{style}
    # Dependency variants apply only to gwcs's own tests. Downstream packages
    # provide their own dependency environments and cannot be combined with
    # dev, oldestdeps, or cov.
    test{,-dev,-oldestdeps,-cov,-xdist}
    test-{jwst,romancal,romanisim,specutils,dkist,ndcube}{,-xdist}
    py{312,313,314}-test{,-dev,-oldestdeps,-cov,-xdist}
    py{312,313,314}-test-{jwst,romancal,romanisim,specutils,dkist,ndcube,stcal}{,-xdist}
    py{312,313,314}-stcal{,-xdist}
    docs
requires =
    tox-uv

[testenv:check-style]
description = Run all style and file checks
skip_install = true
allowlist_externals =
    nox
deps =
    nox
    requests
commands =
    nox -s check-style {posargs}

[testenv:docs]
description = invoke sphinx-build to build the HTML docs
skip_install = true
allowlist_externals =
    nox
deps =
    nox
    requests
commands =
    nox -s docs {posargs}

[testenv]
description =
    run tests
    jwst: of JWST pipeline
    romancal: of Romancal pipeline
    romanisim: of Romanisim image simulation
    specutils: of Specutils
    dkist: of DKIST
    ndcube: of NDCube
    stcal: of STCal
    dev: with the latest developer version of key dependencies
    oldestdeps: with the oldest supported version of key dependencies
    cov: with coverage
    xdist: using parallel processing
skip_install = true
allowlist_externals =
    nox
deps =
    nox
    requests
pass_env =
    HOME
    GITHUB_*
    TOXENV
    CI
    CODECOV_*
    DISPLAY
    CC
    LOCALE_ARCHIVE
    LC_ALL
    jwst,romancal,romanisim: CRDS_*
    romanisim,romancal: STPSF_PATH
    romanisim: GALSIM_CAT_PATH
    romanisim: FFTW_DIR
    romanisim: LIBRARY_PATH
set_env =
    dev: UV_INDEX = https://pypi.anaconda.org/astropy/simple https://pypi.anaconda.org/liberfa/simple https://pypi.anaconda.org/scientific-python-nightly-wheels/simple
    dev: UV_INDEX_STRATEGY = unsafe-any-match
    cov: COVERAGE_FILE={toxinidir}/.coverage
commands =
    nox -s run_from_tox -- {envname} {posargs}
